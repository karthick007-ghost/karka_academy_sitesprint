<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" role="img" aria-label="Generative AI Track 3D Neural Sphere Visual Dark">
  <defs>
    <radialGradient id="ai-glow-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#7BE0AD" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B0F14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core-sphere-dark" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="#0B0F14"/>
  <circle cx="200" cy="200" r="160" fill="url(#ai-glow-dark)"/>

  <!-- Tilted Synaptic Ring -->
  <g transform="rotate(-25 200 200)">
    <ellipse cx="200" cy="200" rx="130" ry="42" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.8" filter="url(#neon-glow)"/>
    <ellipse cx="200" cy="200" rx="145" ry="48" stroke="#7BE0AD" stroke-width="1.2" stroke-dasharray="4 6" stroke-opacity="0.6"/>
  </g>

  <!-- Neural Mesh Links -->
  <g stroke="#7BE0AD" stroke-width="1.5" stroke-opacity="0.7">
    <line x1="200" y1="200" x2="110" y2="130"/>
    <line x1="200" y1="200" x2="290" y2="130"/>
    <line x1="200" y1="200" x2="310" y2="250"/>
    <line x1="200" y1="200" x2="90" y2="250"/>
    <line x1="200" y1="200" x2="200" y2="90"/>
    <line x1="200" y1="200" x2="200" y2="310"/>

    <!-- Outer Interconnects -->
    <line x1="110" y1="130" x2="200" y2="90" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="200" y1="90" x2="290" y2="130" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="290" y1="130" x2="310" y2="250" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="310" y1="250" x2="200" y2="310" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="200" y1="310" x2="90" y2="250" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="90" y1="250" x2="110" y2="130" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>

  <!-- Central Synaptic Neural Core -->
  <circle cx="200" cy="200" r="54" fill="url(#core-sphere-dark)" filter="url(#neon-glow)"/>
  <circle cx="185" cy="185" r="14" fill="#FFFFFF" opacity="0.4"/>

  <!-- Neural Nodes -->
  <circle cx="110" cy="130" r="9" fill="#7BE0AD" filter="url(#neon-glow)"/>
  <circle cx="290" cy="130" r="9" fill="#7BE0AD" filter="url(#neon-glow)"/>
  <circle cx="310" cy="250" r="9" fill="#7BE0AD" filter="url(#neon-glow)"/>
  <circle cx="90" cy="250" r="9" fill="#7BE0AD" filter="url(#neon-glow)"/>
  <circle cx="200" cy="90" r="10" fill="#38BDF8" filter="url(#neon-glow)"/>
  <circle cx="200" cy="310" r="10" fill="#38BDF8" filter="url(#neon-glow)"/>
</svg>
