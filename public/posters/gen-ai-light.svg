<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" role="img" aria-label="Generative AI Track 3D Neural Sphere Visual Light">
  <defs>
    <radialGradient id="ai-glow-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#7BE0AD" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F7F3EC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core-sphere-light" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>
    <filter id="soft-shadow-ai" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="#F7F3EC"/>
  <circle cx="200" cy="200" r="160" fill="url(#ai-glow-light)"/>

  <!-- Tilted Synaptic Ring -->
  <g transform="rotate(-25 200 200)">
    <ellipse cx="200" cy="200" rx="130" ry="42" stroke="#0284C7" stroke-width="2.2" stroke-opacity="0.6"/>
    <ellipse cx="200" cy="200" rx="145" ry="48" stroke="#0B6B45" stroke-width="1.2" stroke-dasharray="4 6" stroke-opacity="0.4"/>
  </g>

  <!-- Neural Mesh Links -->
  <g stroke="#0B6B45" stroke-width="1.6" stroke-opacity="0.6">
    <line x1="200" y1="200" x2="110" y2="130"/>
    <line x1="200" y1="200" x2="290" y2="130"/>
    <line x1="200" y1="200" x2="310" y2="250"/>
    <line x1="200" y1="200" x2="90" y2="250"/>
    <line x1="200" y1="200" x2="200" y2="90"/>
    <line x1="200" y1="200" x2="200" y2="310"/>

    <!-- Outer Interconnects -->
    <line x1="110" y1="130" x2="200" y2="90" stroke="#6C2BD9" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="200" y1="90" x2="290" y2="130" stroke="#6C2BD9" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="290" y1="130" x2="310" y2="250" stroke="#6C2BD9" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="310" y1="250" x2="200" y2="310" stroke="#6C2BD9" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="200" y1="310" x2="90" y2="250" stroke="#6C2BD9" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="90" y1="250" x2="110" y2="130" stroke="#6C2BD9" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>

  <!-- Central Synaptic Neural Core -->
  <circle cx="200" cy="200" r="54" fill="url(#core-sphere-light)" filter="url(#soft-shadow-ai)"/>
  <circle cx="185" cy="185" r="14" fill="#FFFFFF" opacity="0.6"/>

  <!-- Neural Nodes -->
  <circle cx="110" cy="130" r="9" fill="#0B6B45" filter="url(#soft-shadow-ai)"/>
  <circle cx="290" cy="130" r="9" fill="#0B6B45" filter="url(#soft-shadow-ai)"/>
  <circle cx="310" cy="250" r="9" fill="#0B6B45" filter="url(#soft-shadow-ai)"/>
  <circle cx="90" cy="250" r="9" fill="#0B6B45" filter="url(#soft-shadow-ai)"/>
  <circle cx="200" cy="90" r="10" fill="#0284C7" filter="url(#soft-shadow-ai)"/>
  <circle cx="200" cy="310" r="10" fill="#0284C7" filter="url(#soft-shadow-ai)"/>
</svg>
