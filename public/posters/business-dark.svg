<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" role="img" aria-label="Business & Finance Track 3D Ledger Visual Dark">
  <defs>
    <radialGradient id="biz-glow-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#B8964E" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0B0F14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ledger-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="#0B0F14"/>
  <circle cx="200" cy="200" r="160" fill="url(#biz-glow-dark)"/>

  <!-- Orbital Impulse Trend Ring -->
  <ellipse cx="200" cy="215" rx="140" ry="46" stroke="#B8964E" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.6"/>

  <!-- Upward Growth Delta Diamond Prism -->
  <g filter="url(#emerald-glow)">
    <polygon points="200,75 224,115 200,155 176,115" fill="#34D399" stroke="#A7F3D0" stroke-width="2"/>
    <polygon points="200,75 224,115 200,155" fill="#059669"/>
    <!-- Growth Delta Upward Arrow Line -->
    <line x1="200" y1="170" x2="200" y2="155" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Crystalline Ledger Foundation Bar -->
  <g transform="translate(0, 45)">
    <!-- Base Platform Slab -->
    <polygon points="200,215 315,180 200,145 85,180" fill="#121821" stroke="#334155" stroke-width="1.5"/>
    <polygon points="85,180 200,215 200,230 85,195" fill="#064E3B"/>
    <polygon points="200,215 315,180 315,195 200,230" fill="#065F46"/>

    <!-- Left & Right Stanchion Posts -->
    <rect x="95" y="140" width="12" height="45" rx="3" fill="#B8964E" stroke="#FDE68A" stroke-width="1"/>
    <rect x="293" y="140" width="12" height="45" rx="3" fill="#B8964E" stroke="#FDE68A" stroke-width="1"/>

    <!-- Dual Rails -->
    <!-- Rail 1 (Upper) -->
    <line x1="107" y1="152" x2="293" y2="152" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Rail 2 (Lower) -->
    <line x1="107" y1="172" x2="293" y2="172" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Modern Abacus Beads -->
    <!-- Upper Rail Beads -->
    <ellipse cx="140" cy="152" rx="10" ry="7" fill="#059669" stroke="#34D399" stroke-width="1.5" filter="url(#emerald-glow)"/>
    <ellipse cx="195" cy="152" rx="10" ry="7" fill="#059669" stroke="#34D399" stroke-width="1.5" filter="url(#emerald-glow)"/>
    <ellipse cx="260" cy="152" rx="10" ry="7" fill="#059669" stroke="#34D399" stroke-width="1.5" filter="url(#emerald-glow)"/>

    <!-- Lower Rail Beads -->
    <ellipse cx="165" cy="172" rx="10" ry="7" fill="#B8964E" stroke="#FDE68A" stroke-width="1.5"/>
    <ellipse cx="230" cy="172" rx="10" ry="7" fill="#B8964E" stroke="#FDE68A" stroke-width="1.5"/>
    <ellipse cx="275" cy="172" rx="10" ry="7" fill="#B8964E" stroke="#FDE68A" stroke-width="1.5"/>
  </g>
</svg>
