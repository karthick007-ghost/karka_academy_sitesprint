<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" role="img" aria-label="Data Science & ML Track 3D Crystal Visual Dark">
  <defs>
    <radialGradient id="data-glow-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#FF6A2B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0F14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="#0B0F14"/>
  <circle cx="200" cy="200" r="160" fill="url(#data-glow-dark)"/>

  <!-- Orbital Data Ellipse -->
  <ellipse cx="200" cy="225" rx="140" ry="48" stroke="#FFD166" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.5"/>

  <!-- Foundation Base Slab -->
  <polygon points="200,265 310,225 200,185 90,225" fill="#121821" stroke="#334155" stroke-width="1.5"/>
  <polygon points="90,225 200,265 200,280 90,240" fill="#0B0F14"/>
  <polygon points="200,265 310,225 310,240 200,280" fill="#18202C"/>

  <!-- Bar 1 (Height 40) -->
  <g transform="translate(-80, 25)">
    <polygon points="200,200 220,192 200,184 180,192" fill="#FFE082"/>
    <polygon points="180,192 200,200 200,240 180,232" fill="#FF8F00"/>
    <polygon points="200,200 220,192 220,232 200,240" fill="#FFB300"/>
  </g>

  <!-- Bar 2 (Height 70) -->
  <g transform="translate(-25, 0)">
    <polygon points="200,170 220,162 200,154 180,162" fill="#FFE082"/>
    <polygon points="180,162 200,170 200,240 180,232" fill="#FF8F00"/>
    <polygon points="200,170 220,162 220,232 200,240" fill="#FFB300"/>
  </g>

  <!-- Bar 3 (Height 105) -->
  <g transform="translate(30, -25)">
    <polygon points="200,140 220,132 200,124 180,132" fill="#FFE082"/>
    <polygon points="180,132 200,140 200,240 180,232" fill="#FF8F00"/>
    <polygon points="200,140 220,132 220,232 200,240" fill="#FFB300"/>
  </g>

  <!-- Bar 4 (Height 145) -->
  <g transform="translate(85, -50)">
    <polygon points="200,110 220,102 200,94 180,102" fill="#FFE082"/>
    <polygon points="180,102 200,110 200,240 180,232" fill="#FF8F00"/>
    <polygon points="200,110 220,102 220,232 200,240" fill="#FFB300"/>
  </g>

  <!-- Dynamic Trendline -->
  <polyline points="120,185 175,150 230,115 285,75" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#gold-glow)"/>

  <!-- Floating Crystal Data Points (Diamonds) -->
  <g filter="url(#gold-glow)">
    <polygon points="120,170 128,185 120,200 112,185" fill="#FF6A2B"/>
    <polygon points="175,135 183,150 175,165 167,150" fill="#FF6A2B"/>
    <polygon points="230,100 238,115 230,130 222,115" fill="#FF6A2B"/>
    <polygon points="285,60 293,75 285,90 277,75" fill="#FFD166"/>
  </g>
</svg>
