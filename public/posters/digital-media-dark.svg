<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" role="img" aria-label="Digital Media Track 3D Play Prism Visual Dark">
  <defs>
    <radialGradient id="media-glow-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#9333EA" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B0F14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="play-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <filter id="crimson-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="#0B0F14"/>
  <circle cx="200" cy="200" r="160" fill="url(#media-glow-dark)"/>

  <!-- Orbiting Aperture / Lens Frame Ring -->
  <circle cx="200" cy="200" r="125" stroke="#9333EA" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.7"/>
  <circle cx="200" cy="200" r="145" stroke="#E11D48" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- 4 Viewfinder Frame Corners -->
  <g stroke="#E11D48" stroke-width="3" stroke-linecap="round" filter="url(#crimson-glow)">
    <path d="M 100 120 L 100 100 L 120 100"/>
    <path d="M 300 120 L 300 100 L 280 100"/>
    <path d="M 100 280 L 100 300 L 120 300"/>
    <path d="M 300 280 L 300 300 L 280 300"/>
  </g>

  <!-- Faceted 3D Play Button Prism -->
  <g filter="url(#crimson-glow)">
    <!-- Base Shadow Facet -->
    <polygon points="160,130 270,200 160,270" fill="#4C0519"/>
    <!-- Main Extruded Play Prism Face -->
    <polygon points="150,120 260,190 150,260" fill="url(#play-grad-dark)" stroke="#FDA4AF" stroke-width="2"/>
    <!-- Top Chamfer Edge -->
    <polygon points="150,120 260,190 270,200 160,130" fill="#FB7185" opacity="0.6"/>
    <!-- Inner Glowing Core Triangle -->
    <polygon points="170,150 235,190 170,230" fill="#FFF1F2" opacity="0.9"/>
  </g>
</svg>
