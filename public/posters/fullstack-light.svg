<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" role="img" aria-label="Full-Stack Track 3D Architecture Visual Light">
  <defs>
    <radialGradient id="bg-glow-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6A2B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F7F3EC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slab-top-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A3D"/>
      <stop offset="100%" stop-color="#E05518"/>
    </linearGradient>
    <linearGradient id="slab-mid-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2F5EC"/>
    </linearGradient>
    <linearGradient id="slab-base-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E2D5"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14171F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="#F7F3EC"/>
  <circle cx="200" cy="200" r="160" fill="url(#bg-glow-light)"/>

  <!-- Orbital Data Bus Ring -->
  <ellipse cx="200" cy="210" rx="140" ry="46" stroke="#FF6A2B" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.4"/>

  <!-- Layer 1: Database Base Slab -->
  <g transform="translate(0, 40)" filter="url(#soft-shadow)">
    <polygon points="200,220 310,175 200,130 90,175" fill="url(#slab-base-light)" stroke="#D5CDBF" stroke-width="1.2"/>
    <polygon points="90,175 200,220 200,238 90,193" fill="#C7BDAA"/>
    <polygon points="200,220 310,175 310,193 200,238" fill="#D8CFBE"/>
  </g>

  <!-- Connector Pins -->
  <line x1="120" y1="180" x2="120" y2="210" stroke="#0B6B45" stroke-width="3" stroke-linecap="round"/>
  <line x1="280" y1="180" x2="280" y2="210" stroke="#0B6B45" stroke-width="3" stroke-linecap="round"/>

  <!-- Layer 2: API Logic Middle Slab -->
  <g transform="translate(0, 5)" filter="url(#soft-shadow)">
    <polygon points="200,195 295,155 200,115 105,155" fill="url(#slab-mid-light)" stroke="#7BE0AD" stroke-width="1.5"/>
    <polygon points="105,155 200,195 200,210 105,170" fill="#B3E6D0"/>
    <polygon points="200,195 295,155 295,170 200,210" fill="#CAEFE0"/>
  </g>

  <!-- Connector Pins -->
  <line x1="140" y1="130" x2="140" y2="160" stroke="#FF6A2B" stroke-width="3" stroke-linecap="round"/>
  <line x1="260" y1="130" x2="260" y2="160" stroke="#FF6A2B" stroke-width="3" stroke-linecap="round"/>

  <!-- Layer 3: Frontend UI Top Slab -->
  <g transform="translate(0, -30)" filter="url(#soft-shadow)">
    <polygon points="200,170 280,135 200,100 120,135" fill="url(#slab-top-light)" stroke="#FF8A50" stroke-width="1.5"/>
    <polygon points="120,135 200,170 200,182 120,147" fill="#C2410C"/>
    <polygon points="200,170 280,135 280,147 200,182" fill="#E05518"/>
  </g>

  <!-- Floating </> Code Brackets -->
  <g filter="url(#soft-shadow)">
    <!-- Left Bracket < -->
    <path d="M 160 85 L 140 100 L 160 115" stroke="#14171F" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slash / -->
    <line x1="210" y1="80" x2="190" y2="120" stroke="#FF6A2B" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Right Bracket > -->
    <path d="M 240 85 L 260 100 L 240 115" stroke="#14171F" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
