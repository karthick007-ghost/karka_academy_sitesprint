<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" role="img" aria-label="Digital Media Track 3D Play Prism Visual Light">
  <defs>
    <radialGradient id="media-glow-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#9333EA" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F7F3EC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="play-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="soft-shadow-media" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14171F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="#F7F3EC"/>
  <circle cx="200" cy="200" r="160" fill="url(#media-glow-light)"/>

  <!-- Orbiting Aperture / Lens Frame Ring -->
  <circle cx="200" cy="200" r="125" stroke="#6C2BD9" stroke-width="1.8" stroke-dasharray="8 6" stroke-opacity="0.5"/>
  <circle cx="200" cy="200" r="145" stroke="#E11D48" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- 4 Viewfinder Frame Corners -->
  <g stroke="#E11D48" stroke-width="3" stroke-linecap="round">
    <path d="M 100 120 L 100 100 L 120 100"/>
    <path d="M 300 120 L 300 100 L 280 100"/>
    <path d="M 100 280 L 100 300 L 120 300"/>
    <path d="M 300 280 L 300 300 L 280 300"/>
  </g>

  <!-- Faceted 3D Play Button Prism -->
  <g filter="url(#soft-shadow-media)">
    <!-- Base Extruded Shadow Slab -->
    <polygon points="160,130 270,200 160,270" fill="#9F1239"/>
    <!-- Main Play Prism Face -->
    <polygon points="150,120 260,190 150,260" fill="url(#play-grad-light)" stroke="#FECDD3" stroke-width="1.5"/>
    <!-- Top Chamfer Edge -->
    <polygon points="150,120 260,190 270,200 160,130" fill="#FDA4AF"/>
    <!-- Inner High-Contrast Core Triangle -->
    <polygon points="170,150 235,190 170,230" fill="#FFFFFF"/>
  </g>
</svg>
