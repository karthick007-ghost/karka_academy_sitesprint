<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" role="img" aria-label="Cloud & DevOps Track 3D Cloud Cluster Visual Light">
  <defs>
    <radialGradient id="cloud-glow-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#7BE0AD" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F7F3EC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <filter id="soft-shadow-cloud" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14171F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="#F7F3EC"/>
  <circle cx="200" cy="200" r="160" fill="url(#cloud-glow-light)"/>

  <!-- CI/CD Orbital Ring -->
  <ellipse cx="200" cy="205" rx="145" ry="46" stroke="#0284C7" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.5" transform="rotate(-15 200 205)"/>

  <!-- Stylized Procedural Volumetric Cloud Cluster -->
  <g filter="url(#soft-shadow-cloud)">
    <circle cx="200" cy="190" r="48" fill="url(#cloud-grad-light)" stroke="#38BDF8" stroke-width="1.8"/>
    <circle cx="155" cy="205" r="36" fill="url(#cloud-grad-light)" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="245" cy="200" r="38" fill="url(#cloud-grad-light)" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="178" cy="165" r="28" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="220" cy="165" r="30" fill="#FFFFFF" opacity="0.9"/>
    <!-- Cloud Highlight Base -->
    <rect x="150" y="220" width="100" height="18" rx="9" fill="#93C5FD" opacity="0.4"/>
  </g>

  <!-- Mechanical Gear 1 (Upper Right) -->
  <g transform="translate(265, 135)" filter="url(#soft-shadow-cloud)">
    <circle cx="0" cy="0" r="26" fill="#E2F5EC" stroke="#0B6B45" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="10" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5"/>
    <!-- 6 Cog Teeth -->
    <rect x="-4" y="-32" width="8" height="8" rx="2" fill="#0B6B45"/>
    <rect x="-4" y="24" width="8" height="8" rx="2" fill="#0B6B45"/>
    <rect x="24" y="-4" width="8" height="8" rx="2" fill="#0B6B45"/>
    <rect x="-32" y="-4" width="8" height="8" rx="2" fill="#0B6B45"/>
    <rect x="16" y="16" width="8" height="8" rx="2" fill="#0B6B45" transform="rotate(45 20 20)"/>
    <rect x="-24" y="-24" width="8" height="8" rx="2" fill="#0B6B45" transform="rotate(45 -20 -20)"/>
  </g>

  <!-- Mechanical Gear 2 (Lower Left) -->
  <g transform="translate(130, 260)" filter="url(#soft-shadow-cloud)">
    <circle cx="0" cy="0" r="20" fill="#E2F5EC" stroke="#0B6B45" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5"/>
    <!-- 4 Cog Teeth -->
    <rect x="-3.5" y="-25" width="7" height="6" rx="2" fill="#0B6B45"/>
    <rect x="-3.5" y="19" width="7" height="6" rx="2" fill="#0B6B45"/>
    <rect x="19" y="-3.5" width="6" height="7" rx="2" fill="#0B6B45"/>
    <rect x="-25" y="-3.5" width="6" height="7" rx="2" fill="#0B6B45"/>
  </g>
</svg>
