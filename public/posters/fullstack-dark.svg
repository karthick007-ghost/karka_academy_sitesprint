<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" role="img" aria-label="Full-Stack Track 3D Architecture Visual">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6A2B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0F14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slab-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A50"/>
      <stop offset="100%" stop-color="#FF6A2B"/>
    </linearGradient>
    <linearGradient id="slab-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7BE0AD" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F3D2E" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="slab-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="#0B0F14"/>
  <circle cx="200" cy="200" r="160" fill="url(#bg-glow)"/>

  <!-- Orbital Data Bus Ring -->
  <ellipse cx="200" cy="210" rx="140" ry="46" stroke="#FF6A2B" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.6"/>

  <!-- Layer 1: Database Base Slab -->
  <g transform="translate(0, 40)">
    <polygon points="200,220 310,175 200,130 90,175" fill="url(#slab-base)" stroke="#334155" stroke-width="1.5"/>
    <polygon points="90,175 200,220 200,238 90,193" fill="#0B132B"/>
    <polygon points="200,220 310,175 310,193 200,238" fill="#1C2541"/>
  </g>

  <!-- Connector Pins -->
  <line x1="120" y1="180" x2="120" y2="210" stroke="#7BE0AD" stroke-width="3" stroke-linecap="round"/>
  <line x1="280" y1="180" x2="280" y2="210" stroke="#7BE0AD" stroke-width="3" stroke-linecap="round"/>

  <!-- Layer 2: API Logic Middle Slab -->
  <g transform="translate(0, 5)">
    <polygon points="200,195 295,155 200,115 105,155" fill="url(#slab-mid)" stroke="#7BE0AD" stroke-width="1.5"/>
    <polygon points="105,155 200,195 200,210 105,170" fill="#0A3324"/>
    <polygon points="200,195 295,155 295,170 200,210" fill="#134E39"/>
  </g>

  <!-- Connector Pins -->
  <line x1="140" y1="130" x2="140" y2="160" stroke="#FF6A2B" stroke-width="3" stroke-linecap="round"/>
  <line x1="260" y1="130" x2="260" y2="160" stroke="#FF6A2B" stroke-width="3" stroke-linecap="round"/>

  <!-- Layer 3: Frontend UI Top Slab -->
  <g transform="translate(0, -30)">
    <polygon points="200,170 280,135 200,100 120,135" fill="url(#slab-top)" stroke="#FFA07A" stroke-width="2" filter="url(#glow)"/>
    <polygon points="120,135 200,170 200,182 120,147" fill="#C2410C"/>
    <polygon points="200,170 280,135 280,147 200,182" fill="#EA580C"/>
  </g>

  <!-- Floating </> Code Brackets -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 160 85 L 140 100 L 160 115" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slash / -->
    <line x1="210" y1="80" x2="190" y2="120" stroke="#FF6A2B" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Right Bracket > -->
    <path d="M 240 85 L 260 100 L 240 115" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
