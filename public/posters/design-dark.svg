<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" role="img" aria-label="UI/UX & Product Design Track 3D Pen-Nib Visual Dark">
  <defs>
    <radialGradient id="design-glow-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5E7E" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0B0F14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nib-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA8BA"/>
      <stop offset="50%" stop-color="#FF5E7E"/>
      <stop offset="100%" stop-color="#D9204A"/>
    </linearGradient>
    <filter id="pink-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="#0B0F14"/>
  <circle cx="200" cy="200" r="160" fill="url(#design-glow-dark)"/>

  <!-- Arching 3D Bezier Curve -->
  <path d="M 80 250 C 110 100, 290 100, 320 250" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#pink-glow)"/>
  <path d="M 95 245 C 120 120, 280 120, 305 245" stroke="#FF5E7E" stroke-width="1.2" stroke-dasharray="4 6" fill="none" opacity="0.6"/>

  <!-- Tangent Vector Handle Bar -->
  <line x1="100" y1="180" x2="300" y2="180" stroke="#FFD166" stroke-width="2" stroke-linecap="round"/>

  <!-- Handle Anchor Points -->
  <rect x="90" y="170" width="20" height="20" rx="4" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2" filter="url(#pink-glow)"/>
  <rect x="290" y="170" width="20" height="20" rx="4" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2" filter="url(#pink-glow)"/>
  <circle cx="200" cy="180" r="7" fill="#FF5E7E" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Stylized 3D Pen-Nib -->
  <g transform="translate(0, 5)">
    <!-- Barrel -->
    <path d="M 175 140 L 225 140 L 220 190 L 180 190 Z" fill="#2E1065" stroke="#8B5CF6" stroke-width="1.5"/>
    <!-- Collar -->
    <rect x="178" y="188" width="44" height="12" rx="3" fill="#8B5CF6"/>
    <!-- Nib Blade -->
    <path d="M 172 200 L 228 200 L 200 290 Z" fill="url(#nib-grad-dark)" stroke="#FFA8BA" stroke-width="2" filter="url(#pink-glow)"/>
    <!-- Central Breather Hole -->
    <circle cx="200" cy="235" r="7" fill="#0B0F14" stroke="#FFA8BA" stroke-width="1.5"/>
    <!-- Ink Slit -->
    <line x1="200" y1="242" x2="200" y2="288" stroke="#0B0F14" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
