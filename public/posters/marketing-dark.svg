<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" role="img" aria-label="Marketing & Growth Track 3D Megaphone Visual Dark">
  <defs>
    <radialGradient id="mkt-glow-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#EAB308" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0B0F14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horn-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="orange-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="#0B0F14"/>
  <circle cx="200" cy="200" r="160" fill="url(#mkt-glow-dark)"/>

  <!-- Stylized Geometric Megaphone -->
  <g transform="translate(-10, 0)">
    <!-- Driver Housing (Rear) -->
    <circle cx="130" cy="200" r="28" fill="#7C2D12" stroke="#EA580C" stroke-width="2"/>
    <circle cx="125" cy="195" r="8" fill="#FFEDD5" opacity="0.4"/>

    <!-- Angled Grip Handle -->
    <path d="M 140 220 L 125 275 L 145 280 L 158 225 Z" fill="#9A3412" stroke="#EA580C" stroke-width="1.5"/>

    <!-- Conical Horn Body -->
    <polygon points="145,180 235,145 235,255 145,220" fill="url(#horn-grad-dark)" stroke="#FDBA74" stroke-width="2" filter="url(#orange-glow)"/>

    <!-- Front Bell Rim Ring -->
    <ellipse cx="235" cy="200" rx="14" ry="55" fill="#C2410C" stroke="#FED7AA" stroke-width="2.5" filter="url(#orange-glow)"/>
    <ellipse cx="235" cy="200" rx="6" ry="38" fill="#431407"/>
  </g>

  <!-- Expanding Broadcast Soundwaves / Speech Arcs -->
  <g filter="url(#orange-glow)">
    <!-- Arc 1 -->
    <path d="M 270 160 A 55 55 0 0 1 270 240" stroke="#EAB308" stroke-width="4" stroke-linecap="round"/>
    <!-- Arc 2 -->
    <path d="M 305 135 A 90 90 0 0 1 305 265" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
    <!-- Arc 3 -->
    <path d="M 340 115 A 125 125 0 0 1 340 285" stroke="#EAB308" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>

    <!-- Floating Geometric Speech Bubble Accent -->
    <polygon points="265,110 280,125 265,140 250,125" fill="#EAB308"/>
  </g>
</svg>
